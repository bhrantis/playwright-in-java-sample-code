name: Maven Test

on:
  # Run tests on PRs to verify code doesn't break before merge
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - '**/*.java'
      - pom.xml
      - '!.github/workflows/**'
  # Run tests after merge and collect coverage as canonical source of truth
  push:
    branches: [main]
    paths:
      - '**/*.java'
      - pom.xml
  # Allow manual trigger for debugging
  workflow_dispatch:

# Cancel older runs when new commits are pushed to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright dependencies
        run: npx playwright install-deps

      - name: Run tests
        run: mvn verify

      - name: Generate JaCoCo coverage report
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p coverage
          cp target/site/jacoco/jacoco.xml coverage/jacoco.xml

      - name: Upload coverage report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/jacoco.xml
